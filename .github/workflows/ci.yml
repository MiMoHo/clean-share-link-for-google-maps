name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Mozilla addons-linter (via web-ext, ignores dotfiles and tests)
        run: npx --yes web-ext@8 lint --source-dir . --ignore-files 'test' 'test/**' 'scripts' 'scripts/**' 'dist' 'dist/**' 'package.json' 'package-lock.json' '*.md'
